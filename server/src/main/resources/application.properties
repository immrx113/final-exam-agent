server.address=127.0.0.1
server.port=8080
spring.datasource.url=jdbc:mysql://127.0.0.1:${REVIEW_MYSQL_PORT:33306}/review?connectionTimeZone=UTC&allowPublicKeyRetrieval=true&sslMode=DISABLED
spring.datasource.username=review
spring.datasource.password=${REVIEW_DB_PASSWORD}
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=51MB
review.endpoint=http://127.0.0.1:${REVIEW_MINIO_PORT:39000}
review.user=${REVIEW_OBJECT_USER}
review.password=${REVIEW_OBJECT_PASSWORD}
review.office=${REVIEW_OFFICE:soffice.com}
review.ocr=${REVIEW_OCR:m0/ocr.ps1}
server.error.include-message=never
spring.data.redis.host=127.0.0.1
spring.data.redis.port=${REVIEW_REDIS_PORT:36379}
spring.data.redis.connect-timeout=350ms
spring.data.redis.timeout=500ms
spring.task.scheduling.pool.size=2
review.python=${REVIEW_PYTHON:python}
review.agent=${REVIEW_AGENT:m2/agent.py}
review.agent-timeout-seconds=120
review.mineru-url=${REVIEW_MINERU_URL:http://127.0.0.1:8000}
